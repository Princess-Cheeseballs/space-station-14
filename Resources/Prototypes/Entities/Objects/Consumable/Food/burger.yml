# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_single.yml
# Bun

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBun
  name: bun
  description: A hamburger bun. Round and convenient to hold.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
    layers:
    - state: bun
  - type: SolutionManager
    solutions:
    - SolutionFoodBreadBun
  - type: Butcherable
    butcherDelay: 1
    spawned:
      - id: FoodBreadBunTop
        amount: 1
      - id: FoodBreadBunBottom
        amount: 1

- type: entity
  parent: SolutionFoodTiny
  id: SolutionFoodBreadBun
  components:
  - type: Solution
    solution:
      reagents:
      - reagentId: Nutriment
        Quantity: 6.66

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunBottom
  name: bottom bun
  description: It's time to start building the burger tower.
  components:
  - type: Item
    size: Normal #patch until there is an adequate resizing system in place
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: Burger
    maxLayers: 10
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: food-sequence-burger-gen
  - type: Appearance
  - type: FoodMetamorphableByAdding
  - type: SolutionManager
    solutions:
    - SolutionFoodBreadBunHalf

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunTop
  name: top bun
  description: The perfect finish for your burger tower.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_top
  - type: SolutionManager
    solutions:
    - SolutionFoodBreadBunHalf
  - type: FoodSequenceElement
    entries:
      Burger: BunTopBurger

- type: entity
  parent: SolutionFoodTiny
  id: SolutionFoodBreadBunHalf
  components:
  - type: Solution
    canReact: false # To prevent custom burgers from reacting :pensive:
    solution:
      reagents:
      - reagentId: Nutriment
        Quantity: 3.75

# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodBurgerBase
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
  - type: SolutionManager
    solutions:
    - SolutionFoodBurgerBase
  - type: Item
    sprite: Objects/Consumable/Food/burger.rsi
    shape:
    - 0,0,1,0

- type: entity
  parent: SolutionFoodTiny
  id: SolutionFoodBurgerBase
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 11
      - ReagentId: Vitamin
        Quantity: 4

