- type: entity
  id: PhoronWindow
  name: phoron window
  parent: [BaseDeltaPressurePhoron, BaseWindowStructure, BaseRCDResistant, StructureHealthBarrier]
  components:
  - type: Sprite
    sprite: Structures/Windows/window-plasma.rsi
  - type: Icon
    sprite: Structures/Windows/window-plasma.rsi
    state: full
  - type: Damageable
    damageModifierSet: GlassPhoronMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPhoron:
            min: 1
            max: 2
  - type: IconSmooth
    base: pwindow
  - type: Construction
    graph: Window
    node: phoronWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 3
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 100
  - type: RadiationBlocker
    resistance: 2

- type: entity
  id: PhoronWindowDirectional
  parent: [BaseDeltaPressurePhoronQuarter, BaseWindowStructureDirectional, BaseRCDResistant, StructureHealthBarrierWeak]
  name: directional phoron window
  description: Don't smudge up the glass down there.
  components:
  - type: Sprite
    sprite: Structures/Windows/directional.rsi
    state: plasma_window
  - type: Icon
    sprite: Structures/Windows/directional.rsi
    state: plasma_window
  - type: Construction
    graph: WindowDirectional
    node: phoronWindowDirectional
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 1.5
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional.rsi
  - type: Damageable
    damageModifierSet: GlassPhoronMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPhoron:
            min: 1
            max: 1
  - type: StaticPrice
    price: 50
  - type: RadiationBlocker
    resistance: 1

- type: entity
  parent: PhoronWindowDirectional
  id: PhoronWindowDirectionalCorner
  suffix: Corner
  components:
  - type: Sprite
    sprite: Structures/Windows/directional.rsi
    state: plasma_window_corner
  - type: Icon
    sprite: Structures/Windows/directional.rsi
    state: plasma_window_corner
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,-0.28125,-0.28125"
        density: 1500
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Construction
    graph: WindowDirectionalCorner
    node: phoronWindowDirectionalCorner
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional_corner.rsi

- type: entity
  parent: PhoronWindow
  id: PhoronWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Windows/window-diagonal-plasma.rsi
    state: state0
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  - type: Icon
    sprite: Structures/Windows/window-diagonal-plasma.rsi
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi
  - type: Construction
    graph: WindowDiagonal
    node: phoronWindowDiagonal
